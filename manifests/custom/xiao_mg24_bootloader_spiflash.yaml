name: XIAO MG24 external flash bootloader
device: EFR32MG24B220F1536IM48
base_project: src/bootloader_xiao_spiflash
filename: "xiao_mg24_bootloader_spiflash_{gecko_bootloader_version}_gsdk_{sdk_version}"
sdk: "simplicity_sdk:2026.6.1"
toolchain: "gcc:14.2.1.20241119"
gbl:
  fw_type: gecko-bootloader
  gecko_bootloader_version: dynamic
c_defines:
  SL_EUSART_EXTFLASH_PERIPHERAL: EUSART1
  SL_EUSART_EXTFLASH_PERIPHERAL_NO: 1
  SL_EUSART_EXTFLASH_FREQUENCY: 1000000
  SL_EUSART_EXTFLASH_TX_PORT: gpioPortB
  SL_EUSART_EXTFLASH_TX_PIN: 0
  SL_EUSART_EXTFLASH_RX_PORT: gpioPortB
  SL_EUSART_EXTFLASH_RX_PIN: 1
  SL_EUSART_EXTFLASH_SCLK_PORT: gpioPortA
  SL_EUSART_EXTFLASH_SCLK_PIN: 0
  SL_EUSART_EXTFLASH_CS_PORT: gpioPortA
  SL_EUSART_EXTFLASH_CS_PIN: 6

sdk_patches:
  - sfdp-flash-geometry.patch
