name: XIAO MG24 OpenThread RCP (external antenna)
device: EFR32MG24B220F1536IM48
base_project: src/openthread_rcp_xiao
filename: "{manifest_name}_{ot_rcp_version.split('/')[-1]}_gsdk_{sdk_version}"
sdk: "simplicity_sdk:2026.6.1"
toolchain: "gcc:14.2.1.20241119"

gbl:
  fw_type: openthread_rcp
  ot_rcp_version: dynamic
  baudrate: 460800

# Match the reliability patches used by Nabu Casa's MG24 RCP builds.
sdk_patches:
  - disable_gp_rx_filter.patch
  - uart_tx_drop_on_timeout.patch
  - uart_tx_bounded_wait_eusart.patch

# These values are applied after SLC generation by build_project.py.
configuration:
  SL_IOSTREAM_EUSART_VCOM_FLOW_CONTROL_TYPE: SL_IOSTREAM_EUSART_UART_FLOW_CTRL_NONE

c_defines:
  OPENTHREAD_CONFIG_NCP_TX_BUFFER_SIZE:
    type: c_flag
    value: 4096

  SL_IOSTREAM_EUSART_VCOM_PERIPHERAL: EUSART0
  SL_IOSTREAM_EUSART_VCOM_PERIPHERAL_NO: 0
  SL_IOSTREAM_EUSART_VCOM_BAUDRATE: 460800
  SL_IOSTREAM_EUSART_VCOM_TX_PORT: SL_GPIO_PORT_A
  SL_IOSTREAM_EUSART_VCOM_TX_PIN: 8
  SL_IOSTREAM_EUSART_VCOM_RX_PORT: SL_GPIO_PORT_A
  SL_IOSTREAM_EUSART_VCOM_RX_PIN: 9
  SL_IOSTREAM_EUSART_VCOM_RX_BUFFER_SIZE: 512

  XIAO_EXTERNAL_ANTENNA:
    type: c_flag
    value: 1
